name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest               # Apple Silicon
            artifact: LensLabels-macOS
          - os: macos-15-intel             # Intel Macs
            artifact: LensLabels-macOS-Intel
          - os: windows-latest
            artifact: LensLabels-Windows
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow pyinstaller

      # ---- macOS signing + notarization (runs only when secrets are set) ----
      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-build build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-build build.keychain
          rm cert.p12
          ID=$(security find-identity -v -p codesigning build.keychain \
               | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$ID" ]; then
            echo "No Developer ID Application identity found in certificate" >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build
        run: pyinstaller lenslabels.spec

      - name: Sign app bundle
        if: runner.os == 'macOS' && env.CODESIGN_IDENTITY != ''
        run: |
          codesign --force --options runtime --timestamp \
                   --entitlements assets/entitlements.plist \
                   --sign "$CODESIGN_IDENTITY" dist/LensLabels.app
          codesign --verify --deep --strict --verbose=2 dist/LensLabels.app

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/LensLabels.app" "${{ matrix.artifact }}.zip"

      - name: Notarize and staple
        if: runner.os == 'macOS' && env.CODESIGN_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit "${{ matrix.artifact }}.zip" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --wait
          xcrun stapler staple dist/LensLabels.app
          rm "${{ matrix.artifact }}.zip"
          ditto -c -k --keepParent "dist/LensLabels.app" "${{ matrix.artifact }}.zip"

      # ---- Windows ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/LensLabels -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  # One job publishes the release after both builds finish, so the two
  # matrix jobs never race each other to create it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
